services:
  postgres:
    image: postgres:16
    container_name: recoia-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-recoia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recoia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
