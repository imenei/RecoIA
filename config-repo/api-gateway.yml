server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: catalogue-service
              uri: lb://catalogue-service
              predicates:
                - Path=/api/courses/**, /api/images/**
            - id: activity-service
              uri: lb://activity-service
              predicates:
                - Path=/api/activity/**, /api/recommendations/**
            - id: reco-service
              uri: lb://reco-service
              predicates:
                - Path=/api/reco/**
            - id: stats-service
              uri: lb://stats-service
              predicates:
                - Path=/graphql, /graphiql
