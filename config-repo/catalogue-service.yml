server:
  port: 8082

# Base de donnees (utilisee quand spring-boot-starter-data-jpa sera ajoute)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogue_db
    username: ${DB_USER:recoia}
    password: ${DB_PASSWORD:recoia}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
