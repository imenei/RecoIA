server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogue_db
    username: ${DB_USER:postgres}
    password: ${CATALOGUE_DB_PASSWORD:${DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  upload-dir: ${UPLOAD_DIR:./uploads}

catalogue:
  upload-dir: ${UPLOAD_DIR:./uploads}