server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/activity_db
    username: ${DB_USER:postgres}
    # meme mot de passe que le catalogue si ACTIVITY_DB_PASSWORD n'est pas defini
    password: ${ACTIVITY_DB_PASSWORD:${CATALOGUE_DB_PASSWORD:${DB_PASSWORD:}}}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  grpc:
    server:
      # serveur gRPC (statistiques pour stats-service) : port different du port HTTP 8083
      port: 9091

app:
  jwt:
    # DOIT etre identique a auth-service et catalogue-service. A surcharger via JWT_SECRET.
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
